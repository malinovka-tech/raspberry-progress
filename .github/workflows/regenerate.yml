name: Regenerate progress

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "scripts/**"
      - "config.json"
      - ".github/workflows/regenerate.yml"
  repository_dispatch:
    types: [raspberry-progress]
  workflow_dispatch:
    inputs:
      current_kg:
        description: Total raspberry kg from incomes
        required: true
        type: string
      last_delta_kg:
        description: Kg added in this update
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: raspberry-progress-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Render static page
        env:
          TIMEZONE: Europe/Kyiv
          TARGET_KG: ${{ vars.TARGET_KG }}
        run: node scripts/render.js

      - name: Persist harvest state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "Harvest state unchanged."
          else
            git commit -m "chore: update harvest state"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
